<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Michaelka's Training Block</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one 720px column on phones, three columns on PC. */
/* Palette from Michaelka's swatch cards (3 Nov): white bg, ink, paper, cobalt, blue, pink (instead of coral), smoke, periwinkle, maroon. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F9F6EF; --ink:#282828; --muted:#5E6478; --line:#E6E2D8;
  --lav:#F3B3C8; --twilight:#D6D8F7; --pink:#193497; --on-pink:#FFFFFF; --tomato:#89515A; --mint:#E4E7EE; --tang:#F3B3C8;
  --accent:#193497; --accent-ink:#FFFFFF; --accent-soft:#E3E8F7;
  --good:#282828; --good-soft:#E4E7EE; --warn:#89515A; --warn-soft:#FBE3EB; --crit:#89515A; --crit-soft:#FBE3EB;
  --b1:#D6D8F7; --b2:#F3B3C8; --b3:#AAB3C2; --b4:#193497; --dl:#F9F6EF;
  --b1t:#282828; --b2t:#282828; --b3t:#282828; --b4t:#FFFFFF; --dlt:#282828;
  --cake:var(--lav); --sky:var(--twilight); --bahamas:var(--twilight); --bali:var(--lav);
  --bar:#AAB3C2; --bar-hi:#F9F6EF;
  --f-display:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1A1A; --surface:#282828; --sunk:#323232; --ink:#F9F6EF; --muted:#B4B9CC; --line:#3C3C3C;
  --pink:#F3B3C8; --on-pink:#282828; --accent:#F3B3C8; --accent-ink:#282828; --accent-soft:#3E2E38;
  --good:#F4F5FA; --good-soft:#2E3344; --warn:#F3B3C8; --warn-soft:#3E2E38; --crit:#F3B3C8; --crit-soft:#3E2E38;
  --bar:#5A6178; --bar-hi:#8A90A6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1A1A; --surface:#282828; --sunk:#323232; --ink:#F9F6EF; --muted:#B4B9CC; --line:#3C3C3C;
  --pink:#F3B3C8; --on-pink:#282828; --accent:#F3B3C8; --accent-ink:#282828; --accent-soft:#3E2E38;
  --good:#F4F5FA; --good-soft:#2E3344; --warn:#F3B3C8; --warn-soft:#3E2E38; --crit:#F3B3C8; --crit-soft:#3E2E38;
  --bar:#5A6178; --bar-hi:#8A90A6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;font-weight:500}
h1{font-size:clamp(30px,7.5vw,46px);font-weight:300;letter-spacing:.02em;text-transform:uppercase}
h2{font-size:22px}
h3{font-size:17px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:8px}
a{color:var(--accent)}

.top{display:grid;gap:14px;margin-bottom:12px}
.top-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1 .dot{color:var(--pink)}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-mono);font-size:20px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(16,1fr);grid-template-rows:repeat(4,20px);grid-auto-flow:column;gap:4px}
.strip i{cursor:pointer}
.strip i.mood{background:var(--mc)}
.strip i.nomood{background:var(--surface);box-shadow:inset 0 0 0 2px var(--pink)}
.mlegend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:700;margin-top:6px;align-items:center}
.mlegend span{display:inline-flex;align-items:center;gap:4px}
.mlegend i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--mc)}
.strip i{border-radius:5px;background:var(--sunk);display:block}
.strip i.done{background:var(--wc)}
.strip i.opt{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.strip i.opt.done{background:var(--wc)}
.strip i.today{outline:2px solid var(--ink);outline-offset:1px}
.strip-labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:11px;color:var(--muted);margin-top:5px;font-weight:700}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding-block:8px;margin-bottom:14px}
@media (max-width:560px){.tabs{grid-template-columns:repeat(3,1fr)}}
.tabs::-webkit-scrollbar{display:none}
.tab{border:2px solid var(--line);background:var(--surface);padding:6px 4px;text-align:center;min-width:0;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--pink);color:var(--on-pink);border-color:var(--pink)}
.tab.nyt{border-color:var(--pink);color:var(--pink)}
.tab.nyt[aria-selected="true"]{background:var(--pink);color:var(--on-pink)}

.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill{max-width:100%;overflow-wrap:anywhere}
.pill.wk{background:var(--wc);color:var(--wct)}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:800}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pink{background:var(--pink);color:var(--on-pink);border-color:var(--pink)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.4;cursor:default}

.hero{display:grid;gap:12px}
.barbell{position:relative;height:92px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.barbell .shaft{position:absolute;left:2%;right:2%;height:8px;border-radius:4px;background:linear-gradient(var(--bar-hi),var(--bar))}
.barbell .side{position:relative;display:flex;align-items:center;gap:2px;height:100%;flex:1}
.barbell .side.l{justify-content:flex-start;flex-direction:row-reverse}
.barbell .side.r{justify-content:flex-start}
.barbell .grip{position:relative;width:38%;height:8px;flex:none}
.plate{width:var(--pw,9px);height:80px;background:var(--wc);border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(20,53,58,.15);animation:drop .35s ease-out}
.plate.sm{height:54px}
.collar{width:7px;height:26px;background:var(--ink);border-radius:2px;flex:none;opacity:.85}
@keyframes drop{from{transform:scaleY(.2);opacity:.3}to{transform:none;opacity:1}}
.progress{height:12px;background:var(--sunk);border-radius:8px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--wc,var(--accent));border-radius:8px;transition:width .3s}

.rules{display:grid;gap:4px;font-size:13px;padding:10px 12px;border-radius:14px;background:var(--warn-soft);color:var(--ink)}
.rules b{color:var(--warn)}
.ready{display:grid;gap:4px;font-size:14px;padding:12px 14px;border-radius:14px;border:2px solid var(--line)}
.ready.full{background:var(--good-soft);border-color:transparent}
.ready.mod{background:#F2F7F7;border-color:transparent;color:#282828}
.ready.low{background:var(--cake);border-color:transparent;color:#282828}
.ready.stop{background:var(--crit-soft);border-color:transparent}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
@media (max-width:360px){.scale{grid-template-columns:repeat(5,1fr)}}
.scale button{width:100%;min-width:0;height:38px;padding:0;border-radius:11px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-weight:700}
.scale button[aria-pressed="true"]{background:var(--pink);color:var(--on-pink);border-color:var(--pink)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line);cursor:pointer}
.chk:first-child{border-top:0}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.chk.on span.t{color:var(--muted);text-decoration:line-through}
.ex-tag{font-family:var(--f-mono);font-size:12px;font-weight:700;background:var(--lav);color:#282828;border-radius:6px;padding:2px 6px;margin-right:6px}
.new-tag{font-size:11px;font-weight:800;background:var(--mint);color:#282828;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.ex-meta{font-size:13px;color:var(--muted)}
.hint{font-size:13px;padding:7px 11px;background:var(--sunk);border-radius:11px}
.sets{display:grid;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:8px;align-items:center}
.set .lbl{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.field{display:flex;align-items:center;border:2px solid var(--line);border-radius:11px;background:var(--bg);padding:0 8px;min-width:0}
.field input{border:0;background:transparent;width:100%;min-width:0;padding:7px 2px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px;outline:none}
.field span{font-size:12px;color:var(--muted)}
.field:focus-within{border-color:var(--accent)}
.tick{width:44px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;font-weight:800;color:transparent}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details.how summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:800;margin-top:8px}
details.how dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:8px 0 0;font-size:13px}
details.how dt{color:var(--muted)}
details.how dd{margin:0}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.round{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 4px;text-align:center;font-size:12px;font-weight:700}
.round b{display:block;font-family:var(--f-mono);font-size:16px}
.round[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;min-height:70px;resize:vertical}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:11px;padding:6px 4px;min-width:0;text-align:center;font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--pink);color:var(--on-pink);border-color:var(--pink)}
.seg.scroll{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg.scroll button{flex:0 0 42px}
#dq button{display:grid;gap:0;line-height:1.2;padding:6px 2px}
#dq button b{font-family:var(--f-mono);font-size:16px}
#dq button span{font-size:11px}
.done-banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--good-soft);color:var(--good);font-weight:800}

.week{display:grid;gap:10px}
.sessions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.sessions{grid-template-columns:repeat(2,1fr)}}
.stile{border:2px solid var(--line);background:var(--bg);border-radius:13px;padding:9px;text-align:left;display:grid;gap:4px;min-width:0}
.stile .d{font-size:12px;color:var(--muted);font-weight:700}
.stile .n{font-weight:800;font-size:14px}
.stile .p{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.stile .p i{display:block;height:100%;background:var(--wc)}
.stile.done{border-color:var(--wc)}
.stile.opt{border-style:dashed}
.stile.is-today{box-shadow:0 0 0 2px var(--ink)}
.block-head{display:flex;gap:12px;align-items:center}
.block-num{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--wc);color:var(--wct);flex:none}
.wkrow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;padding-top:10px;border-top:1px dashed var(--line)}
.wkrow:first-of-type{border-top:0}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;border:2px dashed var(--line);color:var(--muted)}
.badge.secret{border-color:var(--pink);color:var(--pink)}
.badge.open{background:var(--pink);color:var(--on-pink);border-color:var(--pink);font:inherit;font-size:12px;font-weight:800}
.badge.got{border-style:solid;border-color:transparent;color:#282828;background:var(--lav)}

.meter{display:grid;gap:6px}
.meter .spread b{font-family:var(--f-mono)}
.food-list{display:grid}
.food-item{display:grid;grid-template-columns:1fr auto auto 32px;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.food-item:first-child{border-top:0}
.food-item .num{font-size:14px}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;width:32px;height:32px;border-radius:9px}
.x:hover{background:var(--sunk)}
.addform{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:520px){.addform{grid-template-columns:1fr 1fr}.addform .nm{grid-column:1/-1}.addform .btn{grid-column:1/-1}}
.addform label{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:700;min-width:0}
.addform input,.inp{border:2px solid var(--line);background:var(--bg);border-radius:11px;padding:7px 10px;width:100%;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}

.cal-day{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.cal-day:first-child{border-top:0}
.cal-day .dl b{display:block;font-family:var(--f-display);font-size:22px;line-height:1}
.cal-day .dl span{font-size:12px;color:var(--muted);font-weight:700}
.cal-day.today .dl b{color:var(--pink)}
.evs{display:grid;gap:5px;min-width:0}
.ev{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:13px;padding:6px 9px;border-radius:10px;background:var(--sunk);text-align:left;border:0;width:100%;min-width:0}
.ev .t{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ev.workout{background:var(--wc);color:var(--wct);font-weight:800}
.ev.workout .t{color:inherit;opacity:.85}
.ev.work{background:var(--twilight);color:#282828}
.ev.work .t{color:#282828;opacity:.75}
.ev.holiday{background:var(--cake);color:#282828;font-weight:700}
.ev.holiday .t{color:#282828;opacity:.75}
.ev.cycle{background:var(--lav);color:#282828}
.ev.cycle .t{color:#282828;opacity:.75}
.ev.off{background:transparent;border:2px dashed var(--line);color:var(--muted)}
.ev span{min-width:0;overflow-wrap:anywhere}

.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono)}
.band{background:var(--sunk);border-radius:14px;padding:12px;display:grid;gap:6px}
.bandrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bandrow b{display:block;font-size:20px}
.bandrow span{font-size:12px;color:var(--muted);font-weight:700}
.cyc-now{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.cyc-day{width:74px;height:74px;border-radius:50%;display:grid;place-content:center;text-align:center;background:var(--sunk)}
.cyc-day b{font-family:var(--f-display);font-size:28px;line-height:1}
.cyc-day span{font-size:11px;font-weight:700}
.cyc-day.ph-period{background:var(--pink);color:var(--on-pink)}
.cyc-day.ph-follicular{background:var(--mint);color:#282828}
.cyc-day.ph-ovulation{background:var(--tang)}
.cyc-day.ph-luteal{background:var(--twilight);color:#282828}
.cycgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cyh{font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.cc{position:relative;height:36px;border-radius:10px;border:0;background:var(--sunk);font-family:var(--f-mono);font-size:13px;color:var(--ink);padding:0}
.cc.per{background:var(--pink);color:var(--on-pink)}
.cc.pred{background:var(--surface);box-shadow:inset 0 0 0 2px var(--pink);color:var(--pink)}
.cc.fert{background:var(--lav);color:#282828}
.cc.ov{background:var(--tang)}
.cc.now{outline:2px solid var(--ink);outline-offset:1px}
.cc.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.cc i{position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.chip.on{background:var(--lav);border-color:var(--pink);color:#282828}
.doses{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dose{border:2px dashed var(--line);border-radius:16px;padding:14px 12px;background:var(--surface);display:grid;gap:2px;text-align:left}
.dose .dl{font-weight:800;font-size:15px}
.dose .dt{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.dose.on{background:var(--lav);border:2px solid var(--pink);color:#282828}
.dose.on .dt{color:#282828}
.accdays{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.accday{height:28px;border-radius:7px;overflow:hidden;display:grid;grid-template-rows:1fr 1fr;gap:2px;background:var(--surface)}
.accday i{display:block;background:var(--sunk)}
.accday i.on{background:var(--pink)}
.accday.now{outline:2px solid var(--ink);outline-offset:1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:13px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-mono);font-size:19px}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:6px 4px;border-top:1px dashed var(--line);text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:800;border-top:0}
table.t td.num{text-align:right}

.skill{display:grid;gap:10px}
.ladder{display:grid;gap:0}
.rung{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:6px 0;position:relative}
.rung::before{content:"";position:absolute;left:16px;top:-6px;height:12px;width:2px;background:var(--line)}
.rung:first-child::before{display:none}

    return sk.auto.levels.map(kg=>{let date=null;Object.keys(S.sessions).sort().some(d=>{const v=maxKg((S.sessions[d].sets||{})[sk.auto.ex]||[],sk.auto.minReps);if(v!=null&&v>=kg){date=d;return true}return false});return {label:kg+' kg × 8',date,auto:true}});
  }
  if(sk.auto&&sk.auto.weeks){
    const full=[];WEEKS.forEach(w=>{const ss=SESSIONS.filter(s=>s.week===w&&!s.optional);if(ss.every(isComplete))full.push(addDays(w.start,3))});
    return sk.auto.weeks.map(n=>({label:n+' full week'+(n>1?'s':''),date:full[n-1]||null,auto:true}));
  }
  const got=S.skills[sk.id]||{};
  return sk.steps.map((l,i)=>({label:l,date:got[i]||null}));
}
function skillCount(){let g=0,t=0;SKILLS.forEach(sk=>skillState(sk).forEach(x=>{t++;if(x.date)g++}));return {g,t}}
function badges(){

    ['5 sessions',t.done>=5],['10 skills unlocked',sc.g>=10],['Block 2 done',blockDone(2)],['Halfway · 32 sessions',t.done>=32],['250 sets',t.sets>=250],

function readiness(date){
  const d=S.daily[date]||{},sv=series('sleep')[date],sl=sv!=null?Math.round(sv*10)/10:null;
  let rhrFlag=null;
  if(d.rhr){const prev=[];for(let i=1;i<=7;i++){const x=S.daily[addDays(date,-i)];if(x&&x.rhr)prev.push(+x.rhr)}
    if(prev.length>=3){const avg=prev.reduce((a,b)=>a+b,0)/prev.length;if(+d.rhr>=avg*1.1)rhrFlag='Resting heart rate is '+d.rhr+', more than 10% above your 7-day average ('+Math.round(avg)+'). Active recovery only today.'}}
  const q=d.quality!=null&&d.quality!==''?+d.quality:null;
  if(sl!=null&&sl>=6&&q!=null&&q<=2)return {cls:'mod',head:sl+' h sleep, but you feel '+QUAL[q-1][1].toLowerCase(),text:'Do the session at moderate effort: same weights as last time, nothing extra.',rhrFlag};
  if(sl==null)return {cls:'',head:'How did you sleep?',text:'No band sleep for last night yet. It arrives with the morning sync; wear the band to bed.',rhrFlag};
  if(sl<4)return {cls:'stop',head:sl+' h sleep: no workout today',text:'Do a 10–15 min gentle walk and some stretching instead. This still counts, tick "Mark session done".',rhrFlag};
  if(sl<5)return {cls:'low',head:sl+' h sleep: recovery day',text:'20–30 min easy walk or light mobility. No weights.',rhrFlag};
  if(sl<6)return {cls:'low',head:sl+' h sleep: go about 40% lighter',text:'Shorter session, no heavy first lift.',rhrFlag};
  if(sl<7)return {cls:'mod',head:sl+' h sleep: normal plan, moderate effort',text:'Do the session as written, nothing extra.',rhrFlag};
  return {cls:'full',head:sl+' h sleep: you\'re recovered',text:'Full session. If the first sets fly, take the "harder" option.',rhrFlag};
}

let lastComplete=null;
function updateSessionProgress(s,celebrate){
  const p=progressOf(s);

  $('#slabel').innerHTML='<span class="mono">'+p.done+'/'+p.total+'</span> plates loaded';

  const plates=n=>{let x='';for(let i=0;i<n;i++)x+='<span class="plate'+(i>=per-2?' sm':'')+'" style="--pw:'+pw+'px"></span>';return x};
  $('#barbell').innerHTML='<div class="shaft"></div><div class="side l">'+plates(L)+(L?'<span class="collar"></span>':'')+'</div><div class="grip"></div><div class="side r">'+plates(R)+(R?'<span class="collar"></span>':'')+'</div>';
  const st=S.sessions[s.date],box=$('#donebox');
  if(p.complete){const c=streaks().cur;box.innerHTML='<div class="done-banner"><span style="font-size:22px">✓</span><span>Session done. '+(c>1?c+' sessions in a row.':'That counts.')+'</span></div>'+(st.done&&p.done<p.total?'<button class="btn sm ghost" id="undone" style="margin-top:8px">Unmark as done</button>':'')}
  else box.innerHTML='<button class="btn primary" id="markdone">Mark session done</button> <span class="small muted">Use this if you finished but skipped a box, or did the recovery walk instead.</span>';
  if(celebrate&&p.complete&&lastComplete===false)burst();
  lastComplete=p.complete;renderHeader();
}
function bindWorkout(s){
  const st=sstate(s.date);lastComplete=progressOf(s).complete;
  const go=d=>{const i=SESSIONS.indexOf(s)+d;if(SESSIONS[i]){SEL=SESSIONS[i].date;S.ui.sel=SEL;save();setView('workout');window.scrollTo({top:0})}};
  $('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
  $('#today').onclick=()=>{S.ui.sel=null;SEL=null;const d=defaultSession();SEL=d;S.ui.sel=d;save();setView('workout')};
  const v=$('#view');
  v.addEventListener('input',e=>{const inp=e.target;if(inp.id==='notes'){st.notes=inp.value;save();return}
    const row=inp.closest('.set');if(!row)return;st.sets[row.dataset.ex][+row.dataset.i][inp.dataset.k]=inp.value;save()});
  v.addEventListener('change',e=>{const c=e.target;if(c.dataset&&c.dataset.ck){st.checks[c.dataset.ck]=c.checked;c.closest('.chk').classList.toggle('on',c.checked);save();updateSessionProgress(s,true)}});
  v.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('tick')){
      const row=b.closest('.set'),x=st.sets[row.dataset.ex][+row.dataset.i];x.done=!x.done;
      if(x.done){const k=row.querySelector('[data-k=kg]'),r=row.querySelector('[data-k=reps]');
        if(!x.kg&&k.placeholder&&k.placeholder!=='kg'&&k.placeholder!=='BW'){x.kg=k.placeholder;k.value=x.kg}
        if(!x.reps){const n=parseInt(r.placeholder,10);if(n){x.reps=String(n);r.value=x.reps}}
        const rest=+row.dataset.rest;if(rest)startTimer(rest,'Rest after '+row.dataset.name);
      }
      b.setAttribute('aria-pressed',x.done);save();updateSessionProgress(s,true);return;
    }
    if(b.classList.contains('round')){const k=b.dataset.ck;st.checks[k]=!st.checks[k];b.setAttribute('aria-pressed',st.checks[k]);save();updateSessionProgress(s,true);return}
    const sc=b.closest('.scale,.seg');
    if(sc&&sc.dataset.field){const f=sc.dataset.field,isNum=sc.classList.contains('scale'),val=isNum?+b.dataset.val:b.dataset.val;st[f]=st[f]===val?null:val;
      sc.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',(isNum?+x.dataset.val:x.dataset.val)===st[f]));save();
      if(f==='moodBefore'||f==='moodAfter'){moodNote(sc,st);renderHeader()}return}
    if(b.id==='markdone'){st.done=true;save();updateSessionProgress(s,true);return}
    if(b.id==='undone'){st.done=false;save();updateSessionProgress(s,false);return}
  });
}

function series(field){

  Object.keys(S.daily).forEach(d=>{const v=S.daily[d][field];if(v!==''&&v!=null&&!isNaN(+v))map[d]=+v});
  return map;
}
function rangeDays(n){const hl=HEALTH.length?HEALTH[HEALTH.length-1][0]:TODAY,end=TODAY>hl?TODAY:hl;const a=[];for(let i=n-1;i>=0;i--)a.push(addDays(end,-i));return a}
function chartSVG(days,map,o){
  const W=640,H=190,pl=40,pr=10,pt=14,pb=24,vals=days.map(d=>map[d]).filter(v=>v!=null);
  if(!vals.length)return '<div class="hint">No data in this range yet. Log it above and it shows up here.</div>';
  let y0=o.min!=null?o.min:Math.min(...vals),y1=Math.max(...vals,o.goal||0);
  if(o.min==null){y0=Math.floor(y0-(y1-y0)*0.15)}y1=y1+(y1-y0)*0.08;if(y1===y0)y1=y0+1;
  const n=days.length,bw=(W-pl-pr)/n,X=i=>pl+bw*i+bw/2,Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  let g='';const ticks=4;for(let i=0;i<=ticks;i++){const v=y0+(y1-y0)*i/ticks;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+o.fmt(v)+'</text>'}
  let marks='';
  if(o.type==='bar'){days.forEach((d,i)=>{const v=map[d];if(v==null)return;const y=Y(v),c=o.color(v);marks+='<rect x="'+(X(i)-bw*0.36).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.72).toFixed(1)+'" height="'+Math.max(1,Y(y0)-y).toFixed(1)+'" rx="'+Math.min(3,bw*0.3).toFixed(1)+'" fill="'+c+'"><title>'+fmt(d)+': '+o.fmt(v,true)+'</title></rect>'})}
  else{let path='',pen=false,last=null;days.forEach((d,i)=>{const v=map[d];if(v==null){pen=false;return}path+=(pen?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);pen=true;last=[i,v]});
    marks+='<path d="'+path+'" fill="none" stroke="'+o.color()+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    days.forEach((d,i)=>{const v=map[d];if(v!=null)marks+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(last&&last[0]===i?5:2.5)+'" fill="'+o.color()+'"><title>'+fmt(d)+': '+o.fmt(v,true)+'</title></circle>'})}
  if(o.goal){const gy=Y(o.goal).toFixed(1);marks+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--ink)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="'+(W-pr)+'" y="'+(gy-5)+'" text-anchor="end" font-size="10" fill="var(--ink)">'+o.goalLabel+'</text>'}
  const lab=i=>'<text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===0?'start':i===n-1?'end':'middle')+'" font-size="10" fill="var(--muted)">'+fmtS(days[i])+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label)+'">'+g+marks+lab(0)+lab(Math.floor(n/2))+lab(n-1)+'</svg>';
}
const avgOf=(days,map)=>{const v=days.map(d=>map[d]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};

function sleepWindowSVG(days){
  const night=d=>{const b=bandNight(d);return b?{bed:b.bed,wake:b.wake,quality:(S.daily[d]||{}).quality}:null};
  const ds=days.filter(d=>night(d));
  if(!ds.length)return '<div class="hint">No band sleep times in this range yet. They come in with the morning sync.</div>';
  const W=640,H=200,pl=44,pr=10,pt=10,pb=24,n=days.length,bw=(W-pl-pr)/n,X=i=>pl+bw*i+bw/2;
  const toY=t=>{const p=t.split(':').map(Number);let m=p[0]*60+p[1];if(m<18*60)m+=1440;return m}; // minutes from midnight, night continues past 24h
  let y0=Infinity,y1=-Infinity;ds.forEach(d=>{const n=night(d),b=toY(n.bed);let w=toY(n.wake);if(w<=b)w+=1440;y0=Math.min(y0,b);y1=Math.max(y1,w)});

const PHASES={period:['Period','Train by feel. Light movement often helps cramps; lower the weights if you feel drained.'],follicular:['Follicular','Energy usually climbs. Good days to push (still no failure).'],ovulation:['Ovulation','Often your strongest days. Control the lowering, joints can be looser.'],luteal:['Luteal','Energy dips. Keep it moderate, repeating weights is a win.']};
function periods(){
  const days=new Set();(S.cycleSeed||CYCLE_SEED).forEach(p=>{for(let d=p[0];d<=p[1];d=addDays(d,1))days.add(d)});
  const C=(S.cycle&&S.cycle.days)||{};Object.keys(C).forEach(d=>{const f=C[d].flow;if(f&&f!=='none')days.add(d);else if(f==='none')days.delete(d)});
  const out=[];[...days].sort().forEach(d=>{const l=out[out.length-1];if(l&&dayDiff(l[1],d)<=2)l[1]=d;else out.push([d,d])});return out;
}
function cycleStats(){
  const P=periods(),lens=[];for(let i=1;i<P.length;i++){const l=dayDiff(P[i-1][0],P[i][0]);if(l>=20&&l<=45)lens.push(l)}
  const rec=lens.slice(-6),avg=rec.length?Math.round(rec.reduce((a,b)=>a+b,0)/rec.length):28;
  const lp=P.slice(-6),plen=lp.length?Math.round(lp.reduce((a,p)=>a+dayDiff(p[0],p[1])+1,0)/lp.length):4;
  return {P,avg,plen,lens};
}
function cycleInfo(date){
  const {P,avg,plen}=cycleStats(),past=P.filter(p=>p[0]<=date);if(!past.length)return null;
  const lp=past[past.length-1];let start=lp[0],day=dayDiff(start,date)+1,predicted=false;
  if(date>TODAY){while(day>avg){start=addDays(start,avg);day=dayDiff(start,date)+1;predicted=true}}
  const ov=avg-14,inP=(!predicted&&date<=lp[1])||(predicted&&day<=plen);
  const phase=inP?'period':day<ov-1?'follicular':day<=ov+1?'ovulation':'luteal';
  return {day,phase,start,avg,plen,predicted,ovDate:addDays(start,ov-1),next:addDays(start,avg),fertile:day>=ov-4&&day<=ov+1};
}
function predictedPeriods(from,to){
  const {P,avg,plen}=cycleStats(),out=P.filter(p=>p[1]>=from&&p[0]<=to).map(p=>[p[0],p[1],'Period']);
  if(!P.length)return out;let st=P[P.length-1][0];
  while(st<=to){st=addDays(st,avg);if(st>TODAY&&st<=to)out.push([st,addDays(st,plen-1),'Predicted period'])}

}

function dayEvents(date){
  const s=sessByDate[date],evs=[],d=(new Date(date+'T00:00:00Z').getUTCDay()+6)%7;
  if(CAL_EVENTS.length)CAL_EVENTS.filter(e=>e[0]===date&&e[3]!=='gym'&&e[3]!=='holiday').forEach(e=>evs.push({t:e[1],n:e[2],k:e[3]}));
  else{if(date<=CLASSES_END)(CLASS_WEEK[d]||[]).forEach(e=>evs.push({t:e[0],n:e[1],k:'class'}));if(SHIFTS[d])evs.push({t:SHIFTS[d][0],n:SHIFTS[d][1],k:'work'})}
  if(s){const m=META[s.tpl];evs.push({t:s.time,n:(isComplete(s)?'✓ ':'')+m.name+(m.run&&s.key!=='0lowerA'?' + walk-run':'')+(s.optional?' (optional)':''),k:'workout',go:date})}
  evs.sort((a,b)=>a.t<b.t?-1:1);
  const hol=CAL_EVENTS.find(e=>e[0]===date&&e[3]==='holiday');
  if(hol)evs.unshift({t:'all day',n:hol[2],k:'holiday'});else if(HOLIDAYS[date])evs.unshift({t:'all day',n:HOLIDAYS[date],k:'holiday'});
  predictedPeriods(date,date).forEach(p=>{if(date>=p[0]&&date<=p[1])evs.push({t:'',n:p[2],k:'cycle'})});
  schoolList().filter(r=>r.d===date).forEach(r=>evs.unshift({t:'due',n:(r.s?r.s+': ':'')+String(r.t).split('\n').join(', '),k:'due'}));
  if(d>=4&&!s)evs.push({t:'all day',n:'No gym · 7,000+ steps',k:'off'});
  return evs;
}

function fireworks(){
  const c=$('#nyfx');if(!c)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const r=c.getBoundingClientRect(),W=c.width=r.width,H=c.height=r.height,ctx=c.getContext('2d');
  const cols=['#F3B3C8','#D6D8F7','#E4E7EE','#D6D8F7','#F3B3C8','#282828','#E4E7EE','#D6D8F7'];
  const P=[];let f=0;cancelAnimationFrame(nyAnim);
  const boom=()=>{const x=W*(.15+Math.random()*.7),y=H*(.1+Math.random()*.35),col=cols[Math.floor(Math.random()*cols.length)];for(let i=0;i<46;i++){const a=Math.PI*2*i/46,s=1.5+Math.random()*3.2;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:70+Math.random()*30,c:col})}};
  (function loop(){
    if(f%26===0&&f<230)boom();
    ctx.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.vy+=.045;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0){P.splice(i,1);continue}
      ctx.globalAlpha=Math.min(1,p.life/40);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,7);ctx.fill()}
    ctx.globalAlpha=1;f++;if(f<380||P.length)nyAnim=requestAnimationFrame(loop);else ctx.clearRect(0,0,W,H);
  })();
}

let tEnd=0,tLen=0,tInt=null,actx=null;
function startTimer(sec,label){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  tLen=sec*1000;tEnd=Date.now()+tLen;$('#tlbl').textContent=label;$('#timer').hidden=false;clearInterval(tInt);tInt=setInterval(tick,250);tick()}
function tick(){const left=Math.max(0,tEnd-Date.now()),s=Math.ceil(left/1000);$('#tclock').textContent=Math.floor(s/60)+':'+pad(s%60);$('#tbar').style.width=(100*(1-left/tLen))+'%';
  if(left<=0){clearInterval(tInt);$('#tclock').textContent='Go';$('#tlbl').textContent='Rest done. Next set.';beep();setTimeout(()=>{if(Date.now()>=tEnd)$('#timer').hidden=true},4000)}}
function beep(){if(!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.5);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.5)}catch(e){}}
$('#tplus').onclick=()=>{tEnd+=30000;tLen+=30000;clearInterval(tInt);tInt=setInterval(tick,250);tick()};
$('#tstop').onclick=()=>{clearInterval(tInt);$('#timer').hidden=true};

/* ====== confetti ====== */
function burst(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#fx');c.hidden=false;const ctx=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#282828','#D6D8F7','#D6D8F7','#F3B3C8','#E4E7EE','#E4E7EE'];
  const P=Array.from({length:90},()=>({x:W/2,y:H*0.35,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,w:6+Math.random()*6,h:10+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function loop(){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(++f<110)requestAnimationFrame(loop);else{ctx.clearRect(0,0,W,H);c.hidden=true}})();
}

const span=(a,b)=>{const x=tmin(a),y=tmin(b);if(x==null||y==null)return 0;let d=y-x;if(d<0)d+=1440;return d/60};
